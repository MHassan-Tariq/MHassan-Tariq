name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate-snake
        uses: Platane/snk@v3
        with:
          github_user_name: MHassan-Tariq
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#ebedf0,#fff5b1,#ffeb66,#ffda00,#ccad00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD700&color_dots=#161b22,#4d4100,#7a6700,#b39700,#e6c200

      - name: slow-down-snake
        run: |
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              sed -E 's/[0-9]+ms/120000ms/g' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            fi
          done

      - name: push-to-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
